[project]
name = "constrained-decoding-from-scratch"
version = "0.1.0"
description = "JSON-Schema-constrained decoding from scratch: compile a schema to an automaton, mask a real tokenizer's vocabulary, and measure what guaranteed-valid output does and does not buy you."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/constrained-decoding-from-scratch"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
